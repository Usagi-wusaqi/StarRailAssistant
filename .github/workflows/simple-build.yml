name: Simple Fork Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Clean and restore .NET
        run: |
          dotnet clean SRAFrontend\SRAFrontend.csproj
          dotnet restore SRAFrontend\SRAFrontend.csproj

      - name: Build .NET project (Any CPU first)
        run: |
          dotnet build SRAFrontend\SRAFrontend.csproj -c Release

      - name: Publish .NET project (win-x64)
        run: |
          dotnet publish SRAFrontend\SRAFrontend.csproj -c Release -r win-x64 --self-contained false

      - name: Verify .NET publish output
        run: |
          $publishDir = "SRAFrontend\bin\Release\net8.0\win-x64\publish"
          if (Test-Path $publishDir) {
            echo "✅ Publish directory exists"
            Get-ChildItem $publishDir -Name | ForEach-Object { echo "  - $_" }
          } else {
            echo "❌ Publish directory missing"
            exit 1
          }

      - name: Create packages
        run: |
          python package_complete.py

      - name: Read version
        id: version
        run: |
          $version = (Get-Content version_info.txt -TotalCount 1).Trim()
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StarRailAssistant-Simple-${{ steps.version.outputs.version }}
          path: |
            StarRailAssistant_*.zip
            version_info.txt

      - name: Create simple release
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
          $tagName = "simple-build-$timestamp"

          $releaseNotes = @"
          🔧 **简化构建版本**

          **版本**: $version
          **构建时间**: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')
          **构建方法**: 简化流程，确保兼容性

          **修复内容**:
          - ✅ 修复 .NET 发布配置问题
          - ✅ 简化构建流程
          - ✅ 包含完整的 Python 运行时

          **📦 使用说明**:
          1. 下载 StarRailAssistant_v*.zip (完整版)
          2. 解压到任意目录
          3. 运行 SRA.exe (前端) 或 SRA-cli.bat (后端测试)

          **⚠️ 注意**: 需要 .NET 8.0 Runtime
          "@

          gh release create $tagName `
            --target ${{ github.sha }} `
            --title "Simple Build $version - $timestamp" `
            --notes $releaseNotes `
            --prerelease `
            StarRailAssistant_*.zip version_info.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}